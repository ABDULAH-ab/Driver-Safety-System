<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Driver Monitoring System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
      padding: 20px;
    }

    h1 {
      color: #333;
      margin-bottom: 20px;
      text-align: center;
    }

    .video-container {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin-bottom: 20px;
    }

    .video-label {
      position: absolute;
      top: -25px;
      left: 0;
      font-size: 16px;
      color: #333;
      background-color: rgba(255, 255, 255, 0.8);
      padding: 5px 10px;
      border-radius: 5px;
    }

    #video-feed {
      width: 100%;
      height: 480px;
      background-color: #111;
      border: 2px solid #333;
      border-radius: 10px;
      object-fit: cover;
    }

    #status {
      margin: 10px 0;
      font-size: 18px;
      color: #888;
    }

    .button {
      background-color: #4CAF50;
      border: none;
      color: white;
      padding: 15px 32px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 5px;
      transition: background-color 0.3s ease;
      margin: 10px 0;
    }

    .button:hover {
      background-color: #45a049;
    }

    .offline {
      color: red;
    }

    .online {
      color: green;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }

    @media (max-width: 700px) {
      .video-label {
        font-size: 14px;
        top: -20px;
      }

      .button {
        width: 100%;
        max-width: 300px;
        font-size: 16px;
        padding: 12px 24px;
      }
    }
  </style>
</head>
<body>
  <h1>Driver Monitoring System</h1>

  <div class="controls">
    <button class="button" id="start-stop-btn">Start</button>
    <div id="status" class="offline">Offline</div>
  </div>

  <div class="video-container">
    <div class="video-wrapper">
      <div class="video-label">Processed Feed</div>
      <img id="video-feed" />
    </div>
  </div>

  <script>
    const startStopBtn = document.getElementById('start-stop-btn');
    const videoFeed = document.getElementById('video-feed');
    const statusLabel = document.getElementById('status');
    let stream = null;
    let isStreaming = false;
    let frameInterval = null;

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: 640,
            height: 480,
            facingMode: "user"
          }
        });

        // Hidden video element to capture frames for processing
        const hiddenVideo = document.createElement('video');
        hiddenVideo.style.display = 'none';
        hiddenVideo.width = 640;
        hiddenVideo.height = 480;
        hiddenVideo.autoplay = true;
        hiddenVideo.playsInline = true;
        hiddenVideo.srcObject = stream;
        document.body.appendChild(hiddenVideo);

        frameInterval = setInterval(() => sendFrame(hiddenVideo), 50);

        statusLabel.textContent = 'Online';
        statusLabel.classList.remove('offline');
        statusLabel.classList.add('online');
      } catch (err) {
        console.error('Error accessing camera:', err);
        statusLabel.textContent = 'Camera Error';
        statusLabel.classList.add('offline');
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      if (frameInterval) {
        clearInterval(frameInterval);
        frameInterval = null;
      }

      const hiddenVideo = document.querySelector('video[style*="display: none"]');
      if (hiddenVideo) hiddenVideo.remove();

      videoFeed.src = '';
      statusLabel.textContent = 'Offline';
      statusLabel.classList.remove('online');
      statusLabel.classList.add('offline');
    }

    let isProcessing = false;
    let lastUrl = null;

    async function sendFrame(videoElement) {
      if (!stream || !videoElement || isProcessing) return;
      isProcessing = true;

      const canvas = document.createElement('canvas');
      canvas.width = 640;
      canvas.height = 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

      try {
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));
        const formData = new FormData();
        formData.append('frame', blob);

        const processResponse = await fetch('/process_frame', {
          method: 'POST',
          body: formData
        });

        if (!processResponse.ok) throw new Error('Failed to process frame');

        const response = await fetch('/get_processed_frame');
        if (response.ok && response.status === 200) {
          const blob = await response.blob();
          if (blob.size > 0) {
            const url = URL.createObjectURL(blob);
            if (lastUrl) URL.revokeObjectURL(lastUrl);
            lastUrl = url;
            videoFeed.src = url;
          }
        }
      } catch (err) {
        console.error('Error processing frame:', err);
      } finally {
        isProcessing = false;
      }
    }

    startStopBtn.onclick = async function () {
      if (!isStreaming) {
        await startCamera();
      } else {
        stopCamera();
      }
      isStreaming = !isStreaming;
      startStopBtn.textContent = isStreaming ? 'Stop' : 'Start';
    };
  </script>
</body>
</html>
